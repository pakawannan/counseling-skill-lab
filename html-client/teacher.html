<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instructor Dashboard · Counseling Skill Lab</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">CS</span><span><strong>Instructor Dashboard</strong><small>Counseling Skill Lab</small></span></a><a class="outline-button" href="index.html">หน้าเว็บนักศึกษา</a></header><main class="content" style="margin:auto"><span class="eyebrow">TEACHER ONLY</span><h2>จัดการห้องเรียน</h2><p class="callout">หน้านี้ต้องได้รับการตรวจสิทธิ์จาก Backend ทุก API การซ่อนเมนูเพียงอย่างเดียวไม่ถือว่าเป็นการรักษาความปลอดภัย</p><form id="roomForm" class="panel" style="padding:24px;display:flex;gap:12px;flex-wrap:wrap"><label style="flex:1;min-width:240px">ชื่อห้องเรียน<input id="roomTitle" required minlength="2" style="width:100%;min-height:52px;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--line)"></label><button class="primary-button" type="submit">สร้างรหัสห้อง 4 ตัว</button></form><p id="teacherMessage" role="alert"></p><div id="rooms" class="card-grid"></div><section id="analytics" class="hidden"><h2>ภาพรวมผลการเรียน</h2><div id="analyticsContent" class="panel" style="padding:24px"></div></section></main><footer>ข้อมูลนักศึกษาและคะแนนควรเข้าถึงได้เฉพาะผู้มีสิทธิ์ตามบทบาท</footer><script src="teacher.js" defer></script></body></html>
